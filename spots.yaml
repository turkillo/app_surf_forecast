# Perfiles de spot. Cada uno lleva sus propios umbrales.
# Fuentes: surf-forecast.com, wannasurf.com, geometria de costa.
# El campo `confianza` indica que tan solido es el perfil: cuando es `baja`,
# el backtest historico tiene prioridad sobre el dato documentado.
#
# El dato crudo de cada fuente, y la conversion de cada numero, estan en
# docs/investigacion-spots.md. No cambiar un umbral aca sin actualizar ese
# archivo: sin el registro de la fuente, el numero no es auditable.
#
# SEMANTICA DE `temporada`: son los meses en que SE GENERA el groundswell que
# la `ventana` de ese spot puede recibir. No son los meses de mejor viento, ni
# los de temporada turistica, ni los de agua mas calida. Los 13 spots de este
# archivo tienen ventanas que solo ven sector sur, asi que a todos les
# corresponde el motor austral, que se genera de abril a octubre: [4..10]. La
# unica excepcion es santa_teresa, que suma noviembre porque a 9.65 N esta
# mucho mas lejos de la zona de generacion y la cola de la temporada austral
# le llega un mes mas tarde; su bloque en el doc lo explica.
#
# NO copiar este campo de la "mejor epoca del ano" de surf-forecast: esa
# estadistica mide dias de viento flojo, no meses de swell, y tiene el signo
# invertido en este archivo. Ver la seccion de la trampa en el doc.
#
# UNIDADES DE `min_periodo`: se compara contra `swell_wave_period` de
# Open-Meteo, que es el periodo MEDIO de la particion de swell. No es el
# periodo pico, que es el numero que publican surf-forecast y Wannasurf y del
# que salio la regla original (9 s beach_break / 10 s point_break y reef). La
# Tarea 12 midio la diferencia contra surf-forecast en 5 spots y 45 pares
# (14-16/08/2026): la mediana da -2.1 s, con el mismo signo en los 5. Por eso
# los umbrales quedaron en 7 y 8: son los mismos 9 y 10 expresados en la
# unidad de la variable que se mide. Open-Meteo no sirve periodo pico para
# estos modelos (`swell_wave_peak_period` devuelve vacio, verificado).

